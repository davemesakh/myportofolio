{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ name }} - Portofolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css?v=floating-hearts-20260907">
</head>

<body>
    <div class="background-hearts" aria-hidden="true">
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
        <span class="background-heart"><span class="background-heart-shape"></span></span>
    </div>

    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }} >///<</a>

            <nav>
    <a href="{% url 'main:show_main' %}">Profile</a>
    <a href="{% url 'main:show_experience' %}">Experience</a>
    <a href="{% url 'main:show_awards' %}">Awards</a>
</nav>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">

                <div class="hero-identity">
                    <p class="hero-kicker">
                        Information Systems &middot; Universitas Indonesia
                    </p>
                    <h1>{{ name }} ♡</h1>
                </div>

                <div class="hero-photo">
                    <div class="photo-block"></div>

                    <a class="profile-contact"
                       href="https://www.instagram.com/daveemt/"
                       target="_blank" rel="noopener noreferrer"
                       aria-label="Open David's Instagram in a new tab">
                        <img
                            class="avatar"
                            src="/static/img/IMG_8713.JPG.jpeg"
                            alt="Photo of David"
                        >
                        <span class="profile-contact-bubble" aria-hidden="true">Contact me!</span>
                    </a>
                </div>

                <div class="hero-details">

                    <p class="bio">
                        {{ bio }}
                    </p>

                    <dl class="meta-list">

                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd> {{ npm }} </dd>
                        </div>

                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd> {{ study_program }} </dd>
                        </div>

                    </dl>

                    <div class="social-links">

                        <a
                            href="https://github.com/davemesakh"
                            class="social-link"
                        >
                            GitHub
                        </a>

                        <a
                            href="https://www.linkedin.com/in/david-mesakh-955a01347/"
                            class="social-link"
                        >
                            LinkedIn
                        </a>

                        <a
                            href="mailto:david.mesakh@ui.ac.id"
                            class="social-link"
                        >
                            Email
                        </a>

                    </div>

                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.
            </p>
            <div class="background-animation-control">
                <input type="checkbox" id="background-animation-pause">
                <label for="background-animation-pause">Pause background animation</label>
            </div>
        </div>
    </footer>

</body>
</html>
