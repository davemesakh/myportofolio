{% load static %}
<div id="toast-component" class="toast" popover="manual" role="status" aria-live="polite" aria-atomic="true">
    <span class="toast-indicator" aria-hidden="true"></span>
    <div class="toast-content">
        <h3 id="toast-title"></h3>
        <p id="toast-message"></p>
    </div>
</div>
<script src="{% static 'js/toast.js' %}"></script>
